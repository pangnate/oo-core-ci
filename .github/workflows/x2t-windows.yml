name: X2T Windows stages

on:
  workflow_call:
    inputs:
      rebuild_core:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deps:
    runs-on: windows-2022
    timeout-minutes: 300
    outputs:
      deps-id: ${{ env.X2T_DEPS_ID }}
      compiler-version: ${{ env.X2T_COMPILER_VERSION }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test compiler cache and binary reuse contracts
        shell: pwsh
        run: |
          python -m unittest discover -s tests/core-features -p test_windows_compiler_cache.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/core-features -p test_ci_core_cache.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests/core-features -p test_pch_benchmark.py -v
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify locked inputs
        shell: pwsh
        run: |
          python scripts/verify_vendor.py --platform windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_core_source.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Locate VS2022 and v142
        shell: pwsh
        run: ./scripts/ci_vs_env.ps1
      - name: Identify locked dependency inputs
        run: python scripts/ci_deps_key.py --platform win_64
      - uses: actions/cache@v4
        id: deps-cache
        with:
          path: dist/deps-win_64.tar*
          key: x2t-deps-windows-v1-${{ env.X2T_DEPS_ID }}
      - name: Build Boost and ICU
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: scripts\windows_build.cmd deps
      - name: Archive dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python scripts/ci_handoff.py create --archive dist/deps-win_64.tar --stage deps --platform win_64 --source-sha $env:X2T_DEPS_ID --path core/Common/3dParty/boost/build/win_64 --path core/Common/3dParty/icu/win_64/build --path core/Common/3dParty/heif/libheif/libheif/api --path core/Common/3dParty/heif/libheif/build/win_64 --path core/Common/3dParty/heif/x265_git/build/win_64 --path core/Common/3dParty/heif/libde265/build/win_64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check cached dependency archive
        if: steps.deps-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          python scripts/ci_handoff.py restore --archive dist/deps-win_64.tar --stage deps --platform win_64 --source-sha $env:X2T_DEPS_ID
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: x2t-deps-windows-amd64
          path: dist/deps-win_64.tar*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  build:
    needs: deps
    runs-on: windows-2022
    timeout-minutes: 180
    outputs:
      core-id: ${{ steps.core-inputs.outputs.core-id }}
      cache-hit: ${{ steps.core-cache.outputs.cache-hit }}
    env:
      X2T_DEPS_ID: ${{ needs.deps.outputs.deps-id }}
      X2T_CLEAN: '0'
      X2T_PCH_MODE: disabled
      SCCACHE_GHA_ENABLED: 'false'
      SCCACHE_MULTILEVEL_CHAIN: disk
      SCCACHE_MULTILEVEL_WRITE_ERROR_POLICY: all
      SCCACHE_LOCAL_RW_MODE: READ_WRITE
      SCCACHE_CACHE_SIZE: 8G
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify and patch locked Core
        shell: pwsh
        run: |
          python scripts/verify_vendor.py --platform windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_core_source.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/apply_core_patches.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/apply_core_overlays.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Locate VS2022 and v142
        shell: pwsh
        run: ./scripts/ci_vs_env.ps1
      - name: Check dependency compiler compatibility
        shell: pwsh
        env:
          DEPS_COMPILER_VERSION: ${{ needs.deps.outputs.compiler-version }}
        run: |
          if ($env:X2T_COMPILER_VERSION -ne $env:DEPS_COMPILER_VERSION) {
            throw "Dependency compiler $env:DEPS_COMPILER_VERSION differs from Core compiler $env:X2T_COMPILER_VERSION"
          }
      - name: Identify Core compilation inputs
        id: core-inputs
        run: python scripts/ci_core_cache.py key --platform win_64
      - name: Restore verified Core cache
        if: ${{ !inputs.rebuild_core }}
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: dist/core-cache-win_64.tar*
          key: x2t-core-win_64-v1-${{ env.X2T_CORE_ID }}
      - name: Check and unpack cached Core
        if: steps.core-cache.outputs.cache-hit == 'true'
        run: python scripts/ci_core_cache.py restore --platform win_64
      - name: Prepare Core toolchain
        if: steps.core-cache.outputs.cache-hit != 'true'
        shell: cmd
        run: scripts\windows_build.cmd prepare
      - name: Configure compatible compiler snapshot
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: python scripts/ci_windows_compiler_cache.py configure
      - name: Restore compatible compiler snapshot
        if: steps.core-cache.outputs.cache-hit != 'true'
        id: compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.X2T_COMPILER_SNAPSHOT }}
          key: ${{ env.X2T_COMPILER_CACHE_KEY }}
          restore-keys: ${{ env.X2T_COMPILER_CACHE_PREFIX }}
      - name: Verify restored compiler snapshot
        if: steps.core-cache.outputs.cache-hit != 'true'
        env:
          X2T_COMPILER_CACHE_MATCHED_KEY: ${{ steps.compiler-cache.outputs.cache-matched-key }}
        run: python scripts/ci_windows_compiler_cache.py restored
      - name: Set up pinned compiler cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c # v0.0.11
        with:
          version: v0.18.0
          disable_annotations: true
      - name: Configure bounded cached compilation
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: python scripts/setup_build_acceleration.py
      - uses: actions/download-artifact@v4
        if: steps.core-cache.outputs.cache-hit != 'true'
        with:
          name: x2t-deps-windows-amd64
          path: dist/incoming-deps
      - name: Restore dependency handoff
        if: steps.core-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python scripts/ci_handoff.py restore --archive dist/incoming-deps/deps-win_64.tar --stage deps --platform win_64 --source-sha $env:X2T_DEPS_ID
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Reset compiler cache counters
        if: steps.core-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          & $env:X2T_SCCACHE --zero-stats
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build X2T
        id: compile
        if: steps.core-cache.outputs.cache-hit != 'true'
        timeout-minutes: 170
        shell: cmd
        run: scripts\windows_build.cmd core
      - name: Flush and strictly validate compiler cache
        if: always() && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure')
        run: python scripts/ci_windows_compiler_cache.py finish
      - name: Report executable size
        if: steps.core-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          python scripts/report_windows_size.py --exe core/build/bin/win_64/x2t.exe --map core/build/bin/win_64/x2t.map --receipt dist/windows-size-report.json --max-palette-instances 1 --check-header-statics
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Record Core producer
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: python scripts/ci_core_cache.py record --platform win_64
      - name: Record stopped compiler snapshot
        if: steps.core-cache.outputs.cache-hit != 'true'
        run: python scripts/ci_windows_compiler_cache.py pack
      - name: Save compiler snapshot for subsequent source builds
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.X2T_COMPILER_SNAPSHOT }}
          key: ${{ env.X2T_COMPILER_CACHE_KEY }}
      - name: Confirm new compiler snapshot is durably available
        if: steps.core-cache.outputs.cache-hit != 'true'
        id: saved-compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.X2T_COMPILER_SNAPSHOT }}
          key: ${{ env.X2T_COMPILER_CACHE_KEY }}
          lookup-only: true
          fail-on-cache-miss: true
      - name: Require exact saved compiler snapshot identity
        if: steps.core-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          SAVED_KEY: ${{ steps.saved-compiler-cache.outputs.cache-matched-key }}
        run: |
          if ($env:SAVED_KEY -ne $env:X2T_COMPILER_CACHE_KEY) { throw 'Compiler snapshot was not durably saved under its exact key' }
      - name: Archive Core handoff
        shell: pwsh
        run: |
          python scripts/ci_handoff.py create --archive dist/build-win_64.tar --stage build --platform win_64 --path core/build/bin/win_64 --path core/Common/3dParty/icu/win_64/build --path vendor/work/x2t-core-source-verification.json --path vendor/work/x2t-core-overlay-receipt.json --path dist/windows-size-report.json --path dist/core-producer-win_64.json --path dist/core-reuse-win_64.json --path dist/build-metrics-win_64.json --optional vendor/work/x2t-core-patch-receipt.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: x2t-build-windows-amd64
          path: dist/build-win_64.tar*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x2t-windows-build-diagnostics
          path: |
            core/build/bin/win_64/x2t.map
            dist/windows-size-report.json
            dist/core-inputs-win_64.json
            dist/core-producer-win_64.json
            dist/core-reuse-win_64.json
            dist/build-metrics-win_64.json
            dist/build-win_64.log
            dist/source-path-audit-win_64.json
            dist/sccache-stats-win_64.json
            dist/compiler-cache-restore-win_64.json
            dist/compiler-cache-quality-win_64.json
            dist/compiler-cache-snapshot-win_64.json
            vendor/work/x2t-core-source-verification.json
            vendor/work/x2t-core-patch-receipt.json
            vendor/work/x2t-core-overlay-receipt.json
          if-no-files-found: warn
          retention-days: 30

  verify:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare locked runtime and Qt
        shell: pwsh
        run: |
          python scripts/verify_vendor.py --platform windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/prepare.py --platform windows --runtime-only
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/download-artifact@v4
        with:
          name: x2t-build-windows-amd64
          path: dist/incoming-build
      - name: Restore Core handoff
        shell: pwsh
        run: |
          python scripts/ci_handoff.py restore --archive dist/incoming-build/build-win_64.tar --stage build --platform win_64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Locate VS2022 and v142
        shell: pwsh
        run: ./scripts/ci_vs_env.ps1
      - name: Verify PE and dependencies
        shell: cmd
        run: |
          call "%REAL_VCVARSALL%" x64 -vcvars_ver=14.29
          if errorlevel 1 exit /b 1
          dumpbin /headers core\build\bin\win_64\x2t.exe | findstr /i "machine (x64)"
          if errorlevel 1 exit /b 1
          dumpbin /dependents core\build\bin\win_64\x2t.exe
          if errorlevel 1 exit /b 1
      - name: Check Core compilation identity
        run: python scripts/ci_core_cache.py check --platform win_64 --core-id "${{ needs.build.outputs.core-id }}"
      - name: Add locked Qt to runtime search path
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:GITHUB_WORKSPACE 'vendor/work/qt-win/Qt-5.15.2/msvc2019_64/bin'
          if (!(Test-Path -LiteralPath (Join-Path $qtBin 'Qt5Core.dll'))) { throw "Locked Qt runtime is missing: $qtBin" }
          $qtBin | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: DOCX and PPTX editor-BIN round trip
        shell: pwsh
        run: |
          python scripts/smoke_x2t_runtime.py --x2t core/build/bin/win_64/x2t.exe --fixture-root tests/core-features/fixtures --work-root vendor/work/x2t-baseline-smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Archive verified Core cache
        if: needs.build.outputs.cache-hit != 'true'
        run: python scripts/ci_core_cache.py pack --platform win_64 --core-id "${{ needs.build.outputs.core-id }}"
      - name: Save verified Core cache
        if: needs.build.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dist/core-cache-win_64.tar*
          key: x2t-core-win_64-v1-${{ needs.build.outputs.core-id }}
      - name: Archive verification handoff
        shell: pwsh
        run: |
          python scripts/ci_handoff.py create --archive dist/verify-win_64.tar --stage verify --platform win_64 --path vendor/work/x2t-baseline-smoke/fonts --path vendor/work/x2t-baseline-smoke-receipt.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: x2t-verified-windows-amd64
          path: dist/verify-win_64.tar*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x2t-windows-smoke-diagnostics
          path: vendor/work/x2t-baseline-smoke-receipt.json
          if-no-files-found: warn
          retention-days: 30

  package:
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            config
            runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: x2t-build-windows-amd64
          path: dist/incoming-build
      - uses: actions/download-artifact@v4
        with:
          name: x2t-verified-windows-amd64
          path: dist/incoming-verified
      - name: Restore verified inputs
        shell: pwsh
        run: |
          python scripts/ci_handoff.py restore --archive dist/incoming-build/build-win_64.tar --stage build --platform win_64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/ci_handoff.py restore --archive dist/incoming-verified/verify-win_64.tar --stage verify --platform win_64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Brand and package Windows runtime
        shell: pwsh
        run: ./scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: x2t-windows-amd64
          path: |
            dist/x2t-windows-amd64.exe
            dist/SHA256SUMS-windows-amd64
            dist/core10-windows-*-build-*.zip
            dist/runtime-baseline-receipt.json
            dist/windows-branding-receipt.json
            dist/windows-size-report.json
          if-no-files-found: error
          retention-days: 30

