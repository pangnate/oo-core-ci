        '@ | python -
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - uses: mozilla-actions/sccache-action@fd02668681acd5f960e1372061bee5e3e987195c
      with:
        version: v0.18.0
        disable_annotations: true
    - name: Configure bounded compiler cache
      run: python scripts/setup_build_acceleration.py
    - name: Verify comparable parallelism
      shell: pwsh
      run: |
        if ($env:X2T_BUILD_JOBS -ne '4') { throw 'Recovery requires the original four compile jobs' }
    - name: Reset compiler cache counters
      shell: pwsh
      run: |
        & $env:X2T_SCCACHE --zero-stats
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Build X2T
      id: compile
      shell: cmd
      timeout-minutes: 75
      run: scripts\windows_build.cmd core
    - name: Wait for all cache writes and backfills, then stop daemon
      shell: pwsh
      run: |
        @'
        import json, os, subprocess, time
        from pathlib import Path
        cache=os.environ['X2T_SCCACHE']
        last={}
        try:
            deadline=time.monotonic()+120
            while True:
                raw=subprocess.check_output([cache,'--show-stats','--stats-format','json'],text=True,encoding='utf-8')
                last=json.loads(raw)
                stats=last['stats']; levels=stats.get('multi_level') or []
                misses=sum(stats['cache_misses']['counts'].values())
                completed=stats.get('cache_writes',0)+stats.get('cache_write_errors',0)
                errors=stats.get('cache_write_errors',0)+sum(level.get('write_failures',0) for level in levels)
                backfill_done=True
                if os.environ['X2T_DISK_PHASE']=='migration':
                    if len(levels)!=2 or 'disk' not in levels[0]['name'].lower() or 'gha' not in levels[1]['name'].lower():
                        raise RuntimeError('Expected explicit disk then GHA multilevel stats')
                    backfill_done=levels[0]['backfills_to']==levels[1]['backfills_from']
                    if levels[1]['writes'] or levels[1]['write_failures']:
                        raise RuntimeError('Read-only GHA performed a write')
                if errors:
                    raise RuntimeError('Cache or per-level write error; refuse incomplete archive')
                if completed>=misses and backfill_done:
                    break
                if time.monotonic()>=deadline:
                    raise RuntimeError('Cache writes or backfills did not finish before deadline')
                time.sleep(1)
            Path('dist/sccache-stats-win_64.json').write_text(json.dumps(last),encoding='utf-8')
        finally:
            if last:
                Path('dist/sccache-final-stats-win_64.json').write_text(json.dumps(last),encoding='utf-8')
            subprocess.run([cache,'--stop-server'],check=True)
        '@ | python -
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $deadline = (Get-Date).AddSeconds(30)
        while (Get-Process -Name sccache -ErrorAction SilentlyContinue) {
          if ((Get-Date) -gt $deadline) { throw 'sccache daemon did not exit before archive' }
          Start-Sleep -Milliseconds 250
        }
      if: always() && steps.compile.outcome != 'skipped'
    - name: Extract safe cache-write diagnostics
      if: always() && steps.compile.outcome != 'skipped'
      shell: pwsh
      run: |
        @'
        import json
        import os
        import re
        from pathlib import Path

        # Deliberately export only public source basenames and fixed enumerations.
        # Never export raw error lines, URLs, headers, response bodies or arbitrary keys.
        def summarize(text, allowed_objects):
            misses = []
            errors = []
            for line in text.splitlines():
                match = re.search(r"\[([^\[\]]+)\]: compile result: cache miss", line)
                if match:
                    name = match.group(1).replace("\\", "/").rsplit("/", 1)[-1]
                    misses.append(name if name in allowed_objects else "[unrecognized object]")
                if "Error executing cache write:" not in line:
                    continue
                # Enum values are emitted from this literal list, never copied wholesale.
                kinds = [kind for kind in (
                    "Unexpected", "Unsupported", "ConfigInvalid", "NotFound",
                    "PermissionDenied", "IsADirectory", "NotADirectory", "AlreadyExists",
                    "RateLimited", "IsSameFile", "ConditionNotMatch", "RangeNotSatisfied",
                    "Timeout", "InvalidInput", "ContentIncomplete",
                ) if re.search(r"\b" + kind + r"\b", line)]
                statuses = sorted({int(value) for value in re.findall(
                    r"(?i)\bstatus(?:_code| code)?\s*[:=]\s*(?:Some\()?([1-5][0-9]{2})\b", line
                )})
                operations = [op for op in ("write", "writer", "close", "upload", "reserve", "commit")
                              if re.search(r"(?i)\b" + op + r"\b", line)]
                categories = [name for name, pattern in (
                    ("already_exists", r"already exists|alreadyexists"),
                    ("permission_denied", r"permission denied|permissiondenied|forbidden"),
                    ("timeout", r"timed out|timeout"),
                    ("rate_limited", r"rate.?limit|too many requests"),
                    ("read_only", r"read.only"),
                    ("serialization", r"zip|serializ"),
                    ("connection", r"connection|network|dns"),
                ) if re.search(pattern, line, re.I)]
                errors.append({"kinds": kinds, "httpStatuses": statuses,
                               "operations": operations, "categories": categories,
                               "backend": "ghac" if re.search(r"\bghac\b", line) else "unknown"})
            return {"schemaVersion": 1, "cacheMissObjects": misses,
                    "cacheWriteErrorCount": len(errors), "cacheWriteErrors": errors,
                    "privacy": "Allowlisted fields only; raw logs and arbitrary identifiers omitted."}

        raw = Path(os.environ["SCCACHE_ERROR_LOG"])
        known = {p.stem + ".obj" for p in Path("core").rglob("*")
                 if p.suffix.lower() in {".c", ".cc", ".cpp", ".cxx"}}
        report = summarize(raw.read_text(encoding="utf-8", errors="replace") if raw.is_file() else "", known)
        report["rawLogPresent"] = raw.is_file()
        Path("dist").mkdir(exist_ok=True)
        Path("dist/sccache-write-diagnostic.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
        print(json.dumps(report, indent=2))
        # Only the safe report survives. Raw logs are not an upload input even if removal fails.
        if raw.is_file():
            raw.unlink()
        '@ | python -
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Check executable size
      run: python scripts/report_windows_size.py --exe core/build/bin/win_64/x2t.exe --map core/build/bin/win_64/x2t.map --receipt dist/windows-size-report.json
