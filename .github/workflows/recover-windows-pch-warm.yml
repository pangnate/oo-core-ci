    - name: Require complete cache evidence and no failures
      shell: pwsh
      run: |
        @'
        import json,os
        from pathlib import Path
        raw=json.loads(Path('dist/sccache-stats-win_64.json').read_text(encoding='utf-8'))
        stats=raw['stats']
        requests=stats['compile_requests']; hits=sum(stats['cache_hits']['counts'].values()); misses=sum(stats['cache_misses']['counts'].values())
        for key in ('cache_read_errors','cache_write_errors','cache_timeouts','compile_fails','requests_not_cacheable'):
            if stats.get(key,0): raise RuntimeError('Cache failure: '+key)
        if sum(stats.get('cache_errors',{}).get('counts',{}).values()): raise RuntimeError('Backend read error')
        if any(level.get('write_failures',0) for level in (stats.get('multi_level') or [])): raise RuntimeError('Per-level write failure')
        if requests!=4469: raise RuntimeError('Unexpected request count; not the full known source build')
        if os.environ['X2T_DISK_PHASE']=='disk-warm':
            if hits!=4469 or misses!=0:
                raise RuntimeError('Restored disk-only cache did not cover all 4469 requests')
            levels=stats.get('multi_level') or []
            if len(levels)!=1 or 'disk' not in levels[0]['name'].lower():
                raise RuntimeError('Final validation did not use only disk storage')
        if os.environ['X2T_DISK_PHASE']=='migration' and hits<=0: raise RuntimeError('Migration did not reuse original cache')
        result={'status':'passed','phase':os.environ['X2T_DISK_PHASE'],'requests':requests,'hits':hits,'misses':misses,'location':raw['cache_location']}
        Path('dist/disk-cache-acceptance.json').write_text(json.dumps(result,indent=2),encoding='utf-8')
        print(json.dumps(result,indent=2))
        '@ | python -
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
    - name: Upload build and cache evidence even on failure
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: disk-cache-${{ env.X2T_DISK_PHASE }}-${{ github.run_attempt }}
        path: |
