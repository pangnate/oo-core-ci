name: Build Windows Core feature dependency SDK

on:
  push:
    branches:
      - main
    paths:
      - '.github/actions/restore-v8-windows-sdk/**'
      - '.github/workflows/build-deps-windows.yml'
      - 'ci/**'
      - 'config/**'
      - 'core/**'
      - 'build_tools/**'
      - 'overlays/core/**'
      - 'patches/core/**'
      - 'scripts/build_core_dev.py'
      - 'scripts/core_features.py'
      - 'scripts/download.py'
      - 'scripts/feature_deps/**'
      - 'scripts/manage_v8_windows_sdk.py'
      - 'scripts/patch_x2t_sln.py'
      - 'scripts/stage_core_source.py'
      - 'scripts/verify_core_source.py'
      - 'scripts/build_v8_windows_sdk.py'
      - 'scripts/verify_vendor.py'
      - 'tests/core-features/**'
      - 'vendor/archives/**'
      - 'vendor/checksums.json'
      - 'vendor/runtime/windows-amd64-runtime.zip'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-core-feature-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-feature-sdk:
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate locked source and dependency inputs
        shell: pwsh
        run: |
          python scripts/verify_vendor.py --platform windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_core_source.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Restore fixed V8 SDK release
        id: v8
        uses: ./.github/actions/restore-v8-windows-sdk
        with:
          token: ${{ github.token }}
          destination: ${{ runner.temp }}/v8-windows-sdk

      - name: Assemble and natively probe Core font and image dependencies
        shell: pwsh
        env:
          V8_ROOT: ${{ steps.v8.outputs.sdk-root }}
        run: |
          python scripts/feature_deps/windows.py --v8-root "$env:V8_ROOT"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify isolated incremental Core dev-build entry
        shell: pwsh
        env:
          V8_ROOT: ${{ steps.v8.outputs.sdk-root }}
        run: |
          python scripts/build_core_dev.py --core-root core --sdk-root dist/windows-feature-sdk --v8-root "$env:V8_ROOT" --target dependency-probe --output-root vendor/work/build-core-dev/windows-amd64-msvc142/dependency-probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath vendor/work/build-core-dev/windows-amd64-msvc142/dependency-probe/build-receipt.json -Destination dist/windows-feature-sdk/dev-build-receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows-core-feature-sdk
          path: |
            dist/windows-feature-sdk.zip
            dist/windows-feature-sdk.zip.sha256
            dist/windows-feature-sdk/*
          if-no-files-found: error
          retention-days: 30
