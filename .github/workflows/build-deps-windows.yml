name: Build Windows Core feature dependency SDK

on:
  push:
    branches:
      - main
    paths:
      - '.github/actions/restore-v8-windows-sdk/**'
      - '.github/workflows/build-deps-windows.yml'
      - 'ci/baseline.json'
      - 'config/windows-feature-sdk.lock.json'
      - 'config/v8-windows.lock.json'
      - 'config/windows-dev-build.profile.json'
      - 'config/feature-runtime-deps.lock.json'
      - 'core/**'
      - 'build_tools/**'
      - 'overlays/core/**'
      - 'patches/core/**'
      - 'scripts/build_core_dev.py'
      - 'scripts/download.py'
      - 'scripts/feature_deps/**'
      - 'scripts/manage_v8_windows_sdk.py'
      - 'scripts/patch_x2t_sln.py'
      - 'scripts/stage_core_source.py'
      - 'scripts/verify_core_source.py'
      - 'scripts/verify_vendor.py'
      - 'scripts/ci_feature_sdk_cache.py'
      - 'scripts/ci_vs_env.ps1'
      - 'tests/core-features/cpp/build_deps_windows_probe.cpp'
      - 'vendor/checksums.json'
      - 'vendor/archives/qt_5.15.2_msvc2019_64.7z'
      - 'vendor/archives/brotli-a47d7475063eb223c87632eed806c0070e70da29.tar.gz'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-core-feature-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-feature-sdk:
    runs-on: windows-2022
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate locked source and dependency inputs
        shell: pwsh
        run: |
          python scripts/verify_vendor.py --platform windows
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python scripts/verify_core_source.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Restore fixed V8 SDK release
        id: v8
        uses: ./.github/actions/restore-v8-windows-sdk
        with:
          token: ${{ github.token }}
          destination: ${{ runner.temp }}/v8-windows-sdk

      - name: Identify feature SDK dependency inputs
        id: sdk-inputs
        shell: pwsh
        run: |
          ./scripts/ci_vs_env.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Compute feature SDK cache key
        id: sdk-key
        shell: pwsh
        run: python scripts/ci_feature_sdk_cache.py key

      - name: Restore verified feature dependency SDK
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            dist/windows-feature-sdk
            dist/windows-feature-sdk.zip
            dist/windows-feature-sdk.zip.sha256
            dist/feature-sdk-cache-receipt.json
          key: windows-feature-sdk-v1-${{ steps.sdk-key.outputs.input-id }}

      - name: Check restored feature SDK
        if: steps.sdk-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: python scripts/ci_feature_sdk_cache.py verify

      - name: Assemble and natively probe Core font and image dependencies
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        env:
          V8_ROOT: ${{ steps.v8.outputs.sdk-root }}
        run: |
          python scripts/feature_deps/windows.py --v8-root "$env:V8_ROOT"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Record verified feature SDK cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: python scripts/ci_feature_sdk_cache.py record

      - name: Save verified feature dependency SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            dist/windows-feature-sdk
            dist/windows-feature-sdk.zip
            dist/windows-feature-sdk.zip.sha256
            dist/feature-sdk-cache-receipt.json
          key: windows-feature-sdk-v1-${{ steps.sdk-key.outputs.input-id }}

      - name: Verify isolated incremental Core dev-build entry
        shell: pwsh
        env:
          V8_ROOT: ${{ steps.v8.outputs.sdk-root }}
        run: |
          python scripts/build_core_dev.py --core-root core --sdk-root dist/windows-feature-sdk --v8-root "$env:V8_ROOT" --target dependency-probe --output-root vendor/work/build-core-dev/windows-amd64-msvc142/dependency-probe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath vendor/work/build-core-dev/windows-amd64-msvc142/dependency-probe/build-receipt.json -Destination dist/windows-feature-sdk/dev-build-receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: windows-core-feature-sdk
          path: |
            dist/windows-feature-sdk.zip
            dist/windows-feature-sdk.zip.sha256
            dist/windows-feature-sdk/*
          if-no-files-found: error
          retention-days: 30
