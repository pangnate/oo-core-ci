name: Build X2T

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Select platform to build
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - windows

permissions:
  contents: read

jobs:
  linux:
    if: ${{ inputs.platform == 'linux' || inputs.platform == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    uses: ./.github/workflows/x2t-linux.yml
    with:
      arch: ${{ matrix.arch }}

  windows:
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'all' }}
    uses: ./.github/workflows/x2t-windows.yml
