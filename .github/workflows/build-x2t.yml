name: Build X2T

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Select platform to build'
        required: true
        type: choice
        default: all
        options:
          - all
          - linux
          - windows

permissions:
  contents: read

jobs:
  linux:
    if: ${{ inputs.platform == 'linux' || inputs.platform == 'all' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: linux_64
          - arch: arm64
            target: linux_arm64

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Host packages
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ca-certificates python3 perl pkg-config file binutils \
            rsync p7zip-full zstd xz-utils patchelf

      - name: Verify vendor files
        run: python3 scripts/verify_vendor.py --platform linux

      - name: Prepare offline sources, Qt, sysroots and runtime SOs
        run: python3 scripts/prepare.py --platform linux

      - name: Configure build_tools for ${{ matrix.target }}
        env:
          X2T_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          bt = root / "build_tools"
          detected_file = root / "vendor" / "detected-deps.json"

          detected = {}
          if detected_file.exists():
              detected = json.loads(
                  detected_file.read_text(encoding="utf-8")
              )

          qt_version = (
              detected
              .get("qt_linux_amd64", {})
              .get("version", "5.9.9")
          )

          target = os.environ["X2T_TARGET"]

          cmd = [
              sys.executable,
              str(bt / "configure.py"),
              "--update", "0",
              "--module", "core",
              "--config", "no_tests",
              "--clean", "1",
              "--platform", target,
              "--sysroot", "1",
              "--qt-dir",
              str(
                  bt
                  / "tools"
                  / "linux"
                  / "qt_build"
                  / f"Qt-{qt_version}"
              ).replace("\\", "/"),
          ]

          print("+", " ".join(cmd))
          subprocess.run(cmd, check=True)
          PY

      - name: Build Boost and ICU for ${{ matrix.target }}
        run: python3 scripts/make_minimal_deps.py

      - name: Build X2T ${{ matrix.target }}
        run: python3 scripts/build_x2t.py

      - name: Verify ${{ matrix.target }} binary
        env:
          X2T_TARGET: ${{ matrix.target }}
          X2T_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          X2T="core/build/bin/${X2T_TARGET}/x2t"
          test -x "$X2T"

          echo "=== file ==="
          file "$X2T"

          echo "=== ELF header ==="
          readelf -h "$X2T"

          if [ "$X2T_ARCH" = "amd64" ]; then
            file "$X2T" | grep -Ei 'x86-64|x86_64'
            readelf -h "$X2T" | grep -E 'Machine:.*X86-64'

            echo "=== dynamic dependencies ==="
            LD_LIBRARY_PATH="$PWD/core/build/lib/linux_64:$PWD/core/build/lib/linux_64/system:$PWD/core/Common/3dParty/icu/linux_64/build" \
              ldd "$X2T" | tee /tmp/x2t-ldd.txt

            ! grep -q 'not found' /tmp/x2t-ldd.txt
          else
            file "$X2T" | grep -Ei 'aarch64|ARM'
            readelf -h "$X2T" | grep -E 'Machine:.*AArch64'

            echo "=== ARM64 dynamic NEEDED entries ==="
            readelf -d "$X2T" | grep NEEDED || true
          fi

      - name: Package Linux ${{ matrix.arch }}
        env:
          X2T_TARGET: ${{ matrix.target }}
          X2T_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail

          mkdir -p dist

          cp \
            "core/build/bin/${X2T_TARGET}/x2t" \
            "dist/x2t-linux-${X2T_ARCH}"

          sha256sum \
            "dist/x2t-linux-${X2T_ARCH}" \
            > "dist/SHA256SUMS-linux-${X2T_ARCH}"

          ls -lh dist/

      - name: Upload Linux ${{ matrix.arch }}
        uses: actions/upload-artifact@v4
        with:
          name: x2t-linux-${{ matrix.arch }}
          path: |
            dist/x2t-linux-${{ matrix.arch }}
            dist/SHA256SUMS-linux-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 30

  windows:
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'all' }}
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify vendor files
        run: python scripts/verify_vendor.py --platform windows

      - name: Verify the locked Core source in the checkout
        shell: pwsh
        run: |
          python scripts/verify_core_source.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Apply declared Core overlays to the checkout
        shell: pwsh
        run: |
          python scripts/apply_core_overlays.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Locate VS2022 and v142
        shell: powershell
        run: |
          $vswhere="${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs=& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if(!$vs){ throw 'Visual Studio not found' }

          $vcvars=Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          $v142=Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory |
            Where-Object {$_.Name -like '14.29*'} |
            Select-Object -First 1

          if(!$v142){
            throw 'MSVC v142 (14.29) not installed on windows-2022 runner'
          }

          "REAL_VCVARSALL=$vcvars" |
            Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build Windows X2T
        shell: cmd
        run: scripts\windows_build.cmd

      - name: Verify PE and dependencies
        shell: cmd
        run: |
          call "%REAL_VCVARSALL%" x64 -vcvars_ver=14.29
          dumpbin /headers core\build\bin\win_64\x2t.exe | findstr /i "machine (x64)"
          dumpbin /dependents core\build\bin\win_64\x2t.exe

      - name: Add locked Qt runtime to the smoke-test search path
        shell: pwsh
        run: |
          $qtBin = Join-Path $env:GITHUB_WORKSPACE 'vendor/work/qt-win/Qt-5.15.2/msvc2019_64/bin'
          if (!(Test-Path -LiteralPath (Join-Path $qtBin 'Qt5Core.dll'))) { throw "Locked Qt runtime is missing: $qtBin" }
          $qtBin | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run DOCX and PPTX editor-BIN round-trip smoke
        shell: pwsh
        run: |
          python scripts/smoke_x2t_runtime.py --x2t core/build/bin/win_64/x2t.exe --fixture-root tests/core-features/fixtures --work-root vendor/work/x2t-baseline-smoke
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Package Windows amd64
        shell: powershell
        run: |
          New-Item dist -ItemType Directory -Force | Out-Null

          $packageRoot = Join-Path $env:RUNNER_TEMP 'core10-windows-baseline'
          New-Item $packageRoot -ItemType Directory -Force | Out-Null
          Copy-Item core\build\bin\win_64\* $packageRoot -Recurse -Force
          Copy-Item vendor\work\x2t-baseline-smoke\fonts $packageRoot\fonts -Recurse -Force
          Copy-Item runtime\native-window-shim.js $packageRoot\native-window-shim.js -Force
          Copy-Item runtime\README.md $packageRoot\NATIVE-SDKJS-README.md -Force
          Copy-Item scripts\configure_native_runtime.py $packageRoot\configure_native_runtime.py -Force
          Copy-Item vendor\work\x2t-baseline-smoke-receipt.json dist\runtime-baseline-receipt.json -Force
          Compress-Archive -Path (Join-Path $packageRoot '*') -DestinationPath dist\core10-windows-baseline.zip -CompressionLevel Optimal

          Copy-Item `
            core\build\bin\win_64\x2t.exe `
            dist\x2t-windows-amd64.exe

          $hash = (
            Get-FileHash `
              dist\x2t-windows-amd64.exe `
              -Algorithm SHA256
          ).Hash.ToLower()

          "$hash  x2t-windows-amd64.exe" |
            Set-Content dist\SHA256SUMS-windows-amd64

          $bundleHash = (Get-FileHash dist\core10-windows-baseline.zip -Algorithm SHA256).Hash.ToLower()
          "$bundleHash  core10-windows-baseline.zip" |
            Add-Content dist\SHA256SUMS-windows-amd64

          Get-ChildItem dist

      - name: Upload Windows amd64
        uses: actions/upload-artifact@v4
        with:
          name: x2t-windows-amd64
          path: |
            dist/x2t-windows-amd64.exe
            dist/SHA256SUMS-windows-amd64
            dist/core10-windows-baseline.zip
            dist/runtime-baseline-receipt.json
          if-no-files-found: error
          retention-days: 30
