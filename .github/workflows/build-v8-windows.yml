name: Build pinned V8 Windows SDK

# Dependency bootstrap is explicit; documentation/Core edits never start a cold V8 build.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'reuse: verify fixed SDK; build: build only if missing; promote: publish a successful run artifact'
        type: choice
        default: reuse
        options: [reuse, build, promote]
      source_run_id:
        description: 'Successful build-v8-windows run ID, required for promote'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: v8-windows-sdk-publication
  cancel-in-progress: false

jobs:
  v8-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SDK_OPERATION: ${{ inputs.operation }}
      SDK_SOURCE_RUN: ${{ inputs.source_run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate bootstrap request
        shell: pwsh
        run: |
          if ($env:SDK_OPERATION -notin @('reuse', 'build', 'promote')) {
            throw 'operation must be reuse, build or promote'
          }
          if ($env:SDK_OPERATION -eq 'promote' -and $env:SDK_SOURCE_RUN -notmatch '^[1-9][0-9]*$') {
            throw 'promote requires a successful V8 source_run_id; it never starts a new build'
          }
          if ($env:SDK_OPERATION -ne 'promote' -and $env:SDK_SOURCE_RUN) {
            throw 'source_run_id is only accepted for operation=promote'
          }

      - name: Restore fixed SDK before considering a build
        id: restored
        uses: ./.github/actions/restore-v8-windows-sdk
        with:
          token: ${{ github.token }}
          destination: ${{ runner.temp }}/restored-v8-windows-sdk
          allow-missing: ${{ inputs.operation != 'reuse' }}

      - name: Locate Visual Studio 2019 toolset
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vs) { throw 'Visual Studio C++ tools not found' }
          $v142 = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Directory | Where-Object { $_.Name -like '14.29*' } | Select-Object -First 1
          if (!$v142) { throw 'MSVC v142 (14.29) is required by the V8 SDK ABI lock' }
          "REAL_VCVARSALL=$(Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat')" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "V8_VS_INSTALL_PATH=$vs" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "V8_V142_VERSION=$($v142.Name)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build V8, link SDK probe, and run JavaScript
        if: steps.restored.outputs.found != 'true' && inputs.operation == 'build'
        shell: cmd
        run: |
          call "%REAL_VCVARSALL%" x64 -vcvars_ver=14.29
          if errorlevel 1 exit /b 1
          python scripts\build_v8_windows_sdk.py --work-root vendor\work --dist dist

      - name: Import first successful SDK artifact without rebuilding
        if: steps.restored.outputs.found != 'true' && inputs.operation == 'promote'
        shell: pwsh
        run: |
          python scripts/manage_v8_windows_sdk.py import-run --repo "$env:GITHUB_REPOSITORY" --run-id "$env:SDK_SOURCE_RUN" --asset-dir dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify SDK manifest and archive hash
        id: unpacked
        if: steps.restored.outputs.found != 'true'
        shell: pwsh
        run: |
          python scripts/manage_v8_windows_sdk.py unpack --asset-dir dist --output "$env:RUNNER_TEMP/v8-sdk-publication-probe"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Probe extracted SDK with the Core ABI
        shell: cmd
        env:
          SDK_ROOT: ${{ steps.restored.outputs.sdk-root || steps.unpacked.outputs.sdk-root }}
        run: |
          call "%REAL_VCVARSALL%" x64 -vcvars_ver=14.29
          if errorlevel 1 exit /b 1
          python scripts\manage_v8_windows_sdk.py probe --sdk-root "%SDK_ROOT%" --receipt dist\sdk-probe.json

      - name: Publish fixed SDK Release and verify downloaded bytes
        if: steps.restored.outputs.found != 'true'
        shell: pwsh
        run: |
          python scripts/manage_v8_windows_sdk.py publish --repo "$env:GITHUB_REPOSITORY" --asset-dir dist --probe-receipt dist/sdk-probe.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        if: steps.restored.outputs.found != 'true'
        with:
          name: v8-windows-x64-sdk
          path: |
            dist/v8-windows-x64-sdk.zip
            dist/v8-windows-x64-sdk.zip.sha256
            dist/sdk-release.json
            dist/sdk-probe.json
          if-no-files-found: error
          retention-days: 30

      - name: Record SDK reuse result
        shell: pwsh
        env:
          SDK_TAG: ${{ steps.restored.outputs.release-tag }}
          SDK_FOUND: ${{ steps.restored.outputs.found }}
        run: |
          "V8 SDK: $env:SDK_TAG; existing release restored: $env:SDK_FOUND" >> $env:GITHUB_STEP_SUMMARY
          'SDK extraction and native JavaScript probe passed. SDK bootstrap is separate from Core feature builds.' >> $env:GITHUB_STEP_SUMMARY
